<!DOCTYPE html>
<html lang="fr-FR">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96">
		<link rel="icon" type="image/svg+xml" href="favicon.svg">
		<link rel="shortcut icon" href="favicon.ico">
		<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
		<link rel="manifest" href="site.webmanifest">
	    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
		<link href="css/style.css" rel="stylesheet">
		<title>JustStreamIt - Vidéo à la demande.</title> <!-- JustStreamIt - Video On Demand -->
	</head>

	<body class="container-fluid px-4">
		<main class="container">

			<!-- Section - Page Banner. -->
			<section class="border border-dark p-4" style="background-color: #61787F; height: 122px;">
				<div class="d-flex flex-column flex-sm-row align-items-center justify-content-center justify-content-sm-start h-100">
					<img src="./assets/logo.png"
						 alt="logo JustStreamIt"
						 class="mx-auto mx-sm-0"
						 style="height: 94px; width: 127px;">
					<h1 class="text-light ms-sm-4 mb-0 d-none d-sm-block">Vidéos à la demande</h1>
					<!-- Video On Demand -->
				</div>
			</section>

			<!-- Section - Best Movie -->
			<section>
				<h2 class="text-center text-sm-start mt-4">Meilleur Film</h2> <!-- Best Movie -->
				<div id="best-movie" class="border border-dark border-5 p-3 text-center text-md-start mb-4">
					<!-- Alternative text for the movie poster - Unavailable -->
					<img src="assets/Placeholder.svg"
						 alt="Texte alternatif de l'image de présentation du film - Indisponible"
						 class="img-fluid w-100 img-max-height mb-3 overflow-hidden">
					<!-- Movie title - Unavailable -->
					<h3 class="fw-bold text-start mb-2 overflow-hidden">Titre du film - Indisponible</h3>
					<!-- Movie description text - Unavailable -->
					<p class="text-start text-justify mb-3 mb-sm-1 overflow-hidden">Texte d'introduction du film - non disponible.</p>
					<!-- Details button -->
					<div class="text-center text-sm-end overflow-hidden">
						<button class="btn btn-danger rounded-pill px-4" data-id="MOVIE_ID">Détails</button>
					</div>
				</div>
			</section>

			<!-- Section - Best MovieS -->
			<section>
				<!-- Best MovieS -->
				<h2 class="text-center text-sm-start">Film les mieux notés</h2>
				<div id='best-movies' class="row g-4">
    				<!-- JS injection -->
				</div>

				<div class="text-center d-block d-lg-none">
					<button type="button" class="btn btn-danger showMoreBtn">Voir plus</button> <!-- See more -->
				</div>
			</section>

			<!-- Section - The best movies by categories -->
			<section>
				<!-- The best mystery movies -->
				<h2 class="text-center text-sm-start">Films à suspense les mieux notés</h2>
				<div id='best-mistery' class="row g-4">
    				<!-- JS injection -->
				</div>

				<!-- See more -->
				<div class="text-center d-block d-lg-none">
					<button type="button" class="btn btn-danger showMoreBtn">Voir plus</button>
				</div>
			</section>

			<!-- Section - The best thriller movies -->
			<section>
				<!-- The best thriller movies -->
				<h2 class="text-center text-sm-start">Films d'horreur les mieux notés</h2>
				<div id='best-thriller' class="row g-4">
    				<!-- JS injection -->
				</div>

				<!-- See more -->
				<div class="text-center d-block d-lg-none">
					<button type="button" class="btn btn-danger showMoreBtn">Voir plus</button>
				</div>
			</section>

			<!-- Section - The best action movies -->
			<section>
				<!-- The best action movies -->
				<h2 class="text-center text-sm-start">Films d'actions les mieux notés</h2>
				<div id='best-actions' class="row g-4">
    				<!-- JS injection -->
				</div>

				<!-- See more -->
  				<div class="text-center d-block d-lg-none">
					<button type="button" class="btn btn-danger showMoreBtn">Voir plus</button>
				</div>
			</section>

			<!-- Section - Others best movies in a user defined category -->
			<section class="row film-category-dropdown" >
				<!-- Others: -->
				<h2 class="text-center text-sm-start mt-4">Autres :</h2>
                <select class="col-md-12" name="category" id="categories">
					<!-- JS injection -->
                </select>

                <div class="col-md-12" id="category-section">
					<!-- JS injection -->
				</div>

				<!-- See more -->
				<div class="text-center d-block d-lg-none">
					<button type="button" class="btn btn-danger showMoreBtn">Voir plus</button>
				</div>
            </section>

			<!-- Modal for the details of a movie -->
			<div class="modal hidden"
				 id="movieModal"
				 role="dialog"
				 aria-modal="true"
				 aria-labelledby="filmModalTitle"
				 tabindex="-1">
				<h3 id="filmModalTitle">Détails du film</h3>
			</div>

		</main>
		<!-- Bootstrap with Popper to handle dropdown and popover -->
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
				integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
				crossorigin="anonymous">
		</script>
		<!-- Main JavaScript file -->
		<script src="js/main.js"></script>
	</body>
</html>
